<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>iCenter</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#101215">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="iCenter">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="manifest" href="manifest.json">
<style>
  html, body { margin: 0; height: 100%; background: #101215; color: #F5F3EE; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif; }
  iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; background: #101215; }
  .msg { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 24px; text-align: center; }
  .msg img { width: 72px; height: 72px; border-radius: 18px; }
  .msg b { font-size: 20px; }
  .msg p { margin: 0; max-width: 300px; color: #A8ADB4; font-size: 15px; line-height: 1.45; }
  .spin { width: 28px; height: 28px; border: 3px solid rgba(245,243,238,.15); border-top-color: #FF6B35; border-radius: 50%; animation: g .8s linear infinite; }
  @keyframes g { to { transform: rotate(360deg); } }
  .oculto { display: none; }
</style>
</head>
<body>
<div class="msg" id="cargando"><img src="icon-192.png" alt=""><div class="spin"></div></div>
<div class="msg oculto" id="sinlink"><img src="icon-192.png" alt=""><b>iCenter</b><p>Abrí el link personal que te pasó Fran para entrar a la app.</p></div>
<script>
  // Página de pantalla completa: abre la app de iCenter sin la barra de Google.
  // El link personal llega después del # (ej: .../icenter/#codigo) y nunca viaja al servidor de GitHub.
  var APP = 'https://script.google.com/macros/s/AKfycbw8BWQJpopQSQd-jwTrs6Ty89QpgMKnw6PlhXgIC9rBW2yVWE7KIgl7CG9fbOP8SVk/exec';
  window.addEventListener('hashchange', function () { location.reload(); });
  var tok = decodeURIComponent((location.hash || '').slice(1)).replace(/[^\w-]/g, '');
  try { if (tok) localStorage.setItem('ic_tok', tok); else tok = localStorage.getItem('ic_tok') || ''; } catch (e) {}
  if (!tok) {
    document.getElementById('cargando').classList.add('oculto');
    document.getElementById('sinlink').classList.remove('oculto');
  } else {
    var f = document.createElement('iframe');
    f.src = APP + '?v=' + encodeURIComponent(tok) + '&w=1';
    f.allow = 'clipboard-read; clipboard-write; camera';
    f.onload = function () { document.getElementById('cargando').classList.add('oculto'); };
    document.body.appendChild(f);
    // la app pide recargarse cuando hay versión nueva
    window.addEventListener('message', function (ev) {
      if (!/\.googleusercontent\.com$|^https:\/\/script\.google\.com$/.test(ev.origin)) return;
      if (ev.data && ev.data.icenter === 'recargar') location.reload();
    });
  }
</script>
</body>
</html>
